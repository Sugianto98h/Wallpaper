<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Gallery</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f1a;
            color: #eef4ff;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== ADS ===== */
        .ad-wrap {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 0.8rem;
            padding: 0.5rem;
            margin: 0.6rem 0;
            text-align: center;
            min-height: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ad-wrap .ad-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .ad-wrap .ad-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
        }

        .ad-wrap .ad-box iframe,
        .ad-wrap .ad-box img,
        .ad-wrap .ad-box script {
            max-width: 100%;
        }

        /* Ukuran spesifik */
        .ad-728x90 {
            min-height: 90px;
            max-width: 728px;
            margin: 0 auto;
        }
        .ad-468x60 {
            min-height: 60px;
            max-width: 468px;
            margin: 0 auto;
        }
        .ad-320x50 {
            min-height: 50px;
            max-width: 320px;
            margin: 0 auto;
        }
        .ad-300x250 {
            min-height: 250px;
            max-width: 300px;
            margin: 0 auto;
        }
        .ad-160x600 {
            min-height: 400px;
            max-width: 160px;
            margin: 0 auto;
        }
        .ad-160x300 {
            min-height: 200px;
            max-width: 160px;
            margin: 0 auto;
        }
        .ad-native {
            min-height: 80px;
            max-width: 600px;
            margin: 0 auto;
        }
        .ad-smartlink {
            min-height: 50px;
            max-width: 400px;
            margin: 0 auto;
        }
        .ad-popunder {
            min-height: 30px;
            max-width: 300px;
            margin: 0 auto;
        }
        .ad-socialbar {
            min-height: 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ===== LAYOUT ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin: 0.5rem 0 1rem;
            font-size: 0.85rem;
        }
        .back-btn:hover {
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #7abfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p {
            color: rgba(255, 255, 255, 0.5);
        }
        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8ab4ff;
            margin-top: 0.5rem;
        }

        .sidebar-wrap {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 1.5rem;
            align-items: start;
            margin: 1rem 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .wallpaper-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        .wallpaper-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .wallpaper-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #1a1f2e;
            cursor: pointer;
            position: relative;
        }
        .wallpaper-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        .wallpaper-card:hover .wallpaper-thumb img {
            transform: scale(1.05);
        }
        .wallpaper-thumb .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }
        .wallpaper-thumb:hover .overlay {
            opacity: 1;
        }
        .wallpaper-thumb .overlay span {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .wallpaper-info {
            padding: 0.8rem 1rem 1rem;
        }
        .wallpaper-info .title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .wallpaper-info .meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 0.6rem;
        }

        .btn-group {
            display: flex;
            gap: 0.4rem;
        }
        .btn-group .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            padding: 0.4rem 0.6rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #eef4ff;
        }
        .btn-group .btn-download {
            background: rgba(70, 150, 255, 0.15);
            border-color: rgba(70, 150, 255, 0.2);
            flex: 2;
        }
        .btn-group .btn-download:hover {
            background: rgba(70, 150, 255, 0.3);
        }
        .btn-group .btn-share:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-group .btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255, 255, 255, 0.2);
        }
        .empty-state h3 {
            color: rgba(255, 255, 255, 0.4);
        }
        .empty-state a {
            color: #7abfff;
            text-decoration: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 0.8rem;
        }
        .modal-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            backdrop-filter: blur(8px);
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: rotate(90deg);
        }
        .modal-download-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: rgba(70, 150, 255, 0.2);
            border: 1px solid rgba(70, 150, 255, 0.25);
            border-radius: 60px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(8px);
            z-index: 1001;
        }
        .modal-download-btn:hover {
            background: rgba(70, 150, 255, 0.35);
        }
        .modal-download-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 40, 60, 0.95);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #eef4ff;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.5s;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
        }

        @media (max-width: 768px) {
            .sidebar-wrap {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2rem;
            }
            .gallery {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== POPUNDER ===== -->
        <div class="ad-wrap ad-popunder" id="ad-popunder">
            <div class="ad-label">POPUNDER</div>
            <div class="ad-box" id="adcode-popunder"></div>
        </div>

        <!-- ===== SOCIAL BAR ===== -->
        <div class="ad-wrap ad-socialbar" id="ad-socialbar">
            <div class="ad-label">SOCIAL BAR</div>
            <div class="ad-box" id="adcode-socialbar"></div>
        </div>

        <!-- ===== SMARTLINK ===== -->
        <div class="ad-wrap ad-smartlink" id="ad-smartlink">
            <div class="ad-label">SMARTLINK</div>
            <div class="ad-box" id="adcode-smartlink"></div>
        </div>

        <!-- ===== BANNER 728x90 ===== -->
        <div class="ad-wrap ad-728x90" id="ad-banner728">
            <div class="ad-label">BANNER 728x90</div>
            <div class="ad-box" id="adcode-banner728"></div>
        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>

        <header class="header">
            <h1>Wallpaper Gallery</h1>
            <p>Click image to preview · Download or Share</p>
            <div class="badge">Free HD Wallpapers</div>
        </header>

        <!-- ===== NATIVE BANNER ===== -->
        <div class="ad-wrap ad-native" id="ad-native">
            <div class="ad-label">NATIVE BANNER</div>
            <div class="ad-box" id="adcode-native"></div>
        </div>

        <div class="sidebar-wrap">

            <!-- ===== MAIN CONTENT ===== -->
            <div>

                <!-- ===== GALLERY ===== -->
                <div class="gallery" id="gallery"></div>

                <!-- ===== BANNER 468x60 ===== -->
                <div class="ad-wrap ad-468x60" id="ad-banner468" style="margin-top: 1rem;">
                    <div class="ad-label">BANNER 468x60</div>
                    <div class="ad-box" id="adcode-banner468"></div>
                </div>

                <!-- ===== BANNER 320x50 ===== -->
                <div class="ad-wrap ad-320x50" id="ad-banner320">
                    <div class="ad-label">BANNER 320x50</div>
                    <div class="ad-box" id="adcode-banner320"></div>
                </div>

            </div>

            <!-- ===== SIDEBAR ===== -->
            <div>

                <!-- ===== BANNER 160x600 ===== -->
                <div class="ad-wrap ad-160x600" id="ad-banner160x600">
                    <div class="ad-label">BANNER 160x600</div>
                    <div class="ad-box" id="adcode-banner160x600"></div>
                </div>

                <!-- ===== BANNER 160x300 ===== -->
                <div class="ad-wrap ad-160x300" id="ad-banner160x300" style="margin-top: 0.8rem;">
                    <div class="ad-label">BANNER 160x300</div>
                    <div class="ad-box" id="adcode-banner160x300"></div>
                </div>

                <!-- ===== BANNER 300x250 ===== -->
                <div class="ad-wrap ad-300x250" id="ad-banner300" style="margin-top: 0.8rem;">
                    <div class="ad-label">BANNER 300x250</div>
                    <div class="ad-box" id="adcode-banner300"></div>
                </div>

            </div>

        </div>

        <div class="footer-text">
            Data stored in your browser · localStorage
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">×</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview" />
        </div>
        <a href="#" id="modalDownloadBtn" class="modal-download-btn" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Download
        </a>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        // 1. AMBIL DATA IKLAN DARI LOCALSTORAGE
        // ================================================================
        const ADS_KEY = 'ads_codes';

        function getAds() {
            try {
                const raw = localStorage.getItem(ADS_KEY);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch {
                return [];
            }
        }

        // ================================================================
        // 2. TAMPILKAN IKLAN
        // ================================================================
        function renderAds() {
            const ads = getAds();

            // Mapping ID iklan ke element ID
            const map = {
                popunder: 'adcode-popunder',
                socialbar: 'adcode-socialbar',
                smartlink: 'adcode-smartlink',
                banner728: 'adcode-banner728',
                native: 'adcode-native',
                banner468: 'adcode-banner468',
                banner320: 'adcode-banner320',
                banner160x600: 'adcode-banner160x600',
                banner160x300: 'adcode-banner160x300',
                banner300: 'adcode-banner300',
            };

            ads.forEach(ad => {
                const elId = map[ad.id];
                if (!elId) return;

                const el = document.getElementById(elId);
                if (!el) return;

                // Jika aktif dan ada kode, tampilkan kodenya
                if (ad.active && ad.code && ad.code.trim() !== '') {
                    el.innerHTML = ad.code;
                } else {
                    // Tampilkan placeholder
                    const label = ad.name || ad.id;
                    el.innerHTML =
                        `<span style="color:rgba(255,255,255,0.08);font-size:0.7rem;">[ ${label} - Tidak Aktif ]</span>`;
                }
            });

            // Debug: tampilkan di console
            console.log('✅ Iklan dimuat:', ads.length, 'unit');
        }

        // ================================================================
        // 3. WALLPAPER
        // ================================================================
        const WP_KEY = 'wallpaper_data';

        function getWallpapers() {
            try {
                const raw = localStorage.getItem(WP_KEY);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch {
                return [];
            }
        }

        const wallpapers = getWallpapers();
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownloadBtn');
        const toast = document.getElementById('toast');

        function renderGallery() {
            if (wallpapers.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <h3>Belum ada wallpaper</h3>
                        <p>Admin bisa upload di <a href="adminpanel.html">Admin Panel</a></p>
                    </div>
                `;
                return;
            }

            let html = '';
            wallpapers.forEach((wp, i) => {
                html += `
                    <div class="wallpaper-card">
                        <div class="wallpaper-thumb" onclick="openModal('${wp.image}','${wp.download}','${wp.title}')">
                            <img src="${wp.image}" alt="${wp.title}" loading="lazy" />
                            <div class="overlay"><span>Preview</span></div>
                        </div>
                        <div class="wallpaper-info">
                            <div class="title">${wp.title}</div>
                            <div class="meta">${wp.category} · HD</div>
                            <div class="btn-group">
                                <a href="${wp.download}" download="${wp.title}.jpg" class="btn btn-download">
                                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                    Download
                                </a>
                                <button class="btn btn-share" onclick="shareIt('${wp.title}','${wp.image}')">
                                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                                    Share
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // Sisipkan iklan setiap 4 wallpaper
                if ((i + 1) % 4 === 0 && i < wallpapers.length - 1) {
                    const ads = getAds();
                    const nativeAd = ads.find(a => a.id === 'native');
                    let adContent = '📢 Sponsored';
                    if (nativeAd && nativeAd.active && nativeAd.code && nativeAd.code.trim() !== '') {
                        adContent = nativeAd.code;
                    }
                    html += `
                        <div class="ad-wrap" style="min-height:120px;border:1px solid rgba(255,255,255,0.04);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                            <div class="ad-label">ADVERTISEMENT</div>
                            <div style="font-size:1.5rem;opacity:0.1;margin:0.3rem 0;">📢</div>
                            <div style="font-size:0.7rem;color:rgba(255,255,255,0.05);">${adContent}</div>
                        </div>
                    `;
                }
            });

            gallery.innerHTML = html;
        }

        // ================================================================
        // 4. MODAL
        // ================================================================
        function openModal(imgUrl, dlUrl, title) {
            modalImg.src = imgUrl;
            modalDownload.href = dlUrl;
            modalDownload.download = title + '.jpg';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ================================================================
        // 5. SHARE
        // ================================================================
        function shareIt(title, url) {
            const data = { title, text: 'Check this wallpaper: ' + title, url };
            if (navigator.share) {
                navigator.share(data).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showToast('URL copied!'));
            } else {
                prompt('Copy URL:', url);
            }
        }

        // ================================================================
        // 6. TOAST
        // ================================================================
        let toastTimer;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ================================================================
        // 7. JALANKAN
        // ================================================================
        renderGallery();
        renderAds();

        // Jalankan ulang setiap kali halaman selesai loading
        document.addEventListener('DOMContentLoaded', function() {
            renderAds();
        });

        console.log('✅ Halaman siap!');
        console.log('📢 Jumlah iklan di localStorage:', getAds().length);
        console.log('🖼️ Jumlah wallpaper:', wallpapers.length);
        console.log('💡 Tips: Buka adminpanel.html untuk kelola iklan');
    </script>

</body>
</html>
