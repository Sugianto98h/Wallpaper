<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery · Free Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f1a;
            color: #eef4ff;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== ADS STYLES ===== */
        .ad-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 0.8rem;
            padding: 0.6rem;
            margin: 0.8rem 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 30px;
        }

        .ad-container .ad-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .ad-container .ad-placeholder {
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .ad-container .ad-placeholder iframe,
        .ad-container .ad-placeholder script {
            display: block;
        }

        .ad-container .ad-placeholder img {
            max-width: 100%;
            height: auto;
        }

        .ad-728x90 { min-height: 90px; width: 100%; max-width: 728px; margin: 0 auto; }
        .ad-468x60 { min-height: 60px; width: 100%; max-width: 468px; margin: 0 auto; }
        .ad-320x50 { min-height: 50px; width: 100%; max-width: 320px; margin: 0 auto; }
        .ad-300x250 { min-height: 250px; width: 100%; max-width: 300px; margin: 0 auto; }
        .ad-160x600 { min-height: 600px; width: 100%; max-width: 160px; margin: 0 auto; }
        .ad-160x300 { min-height: 300px; width: 100%; max-width: 160px; margin: 0 auto; }

        .ad-native {
            min-height: 100px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ad-smartlink {
            min-height: 50px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 0.6rem;
            background: rgba(70, 150, 255, 0.04);
            border-radius: 0.8rem;
            border: 1px solid rgba(70, 150, 255, 0.06);
        }

        .ad-popunder {
            min-height: 30px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 0.3rem;
            background: rgba(255, 70, 70, 0.02);
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 70, 70, 0.04);
        }

        .ad-socialbar {
            min-height: 30px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0.3rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0.8rem;
        }

        .ad-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }

        .ad-grid-2 .ad-container {
            margin: 0;
        }

        .ad-sidebar-wrapper {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 1.5rem;
            align-items: start;
            margin: 1rem 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
            font-size: 0.85rem;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #7abfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8ab4ff;
            margin-top: 0.5rem;
        }

        /* ===== GALLERY ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .wallpaper-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .wallpaper-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .wallpaper-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #1a1f2e;
            position: relative;
            cursor: pointer;
        }

        .wallpaper-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .wallpaper-card:hover .wallpaper-thumb img {
            transform: scale(1.05);
        }

        .wallpaper-thumb .preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .wallpaper-thumb:hover .preview-overlay {
            opacity: 1;
        }

        .wallpaper-thumb .preview-overlay span {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: white;
        }

        .wallpaper-info {
            padding: 0.8rem 1rem 1rem;
        }

        .wallpaper-info .title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }

        .wallpaper-info .meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 0.6rem;
        }

        .btn-group {
            display: flex;
            gap: 0.4rem;
        }

        .btn-group .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            padding: 0.4rem 0.6rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #eef4ff;
        }

        .btn-group .btn-download {
            background: rgba(70, 150, 255, 0.15);
            border-color: rgba(70, 150, 255, 0.2);
            flex: 2;
        }

        .btn-group .btn-download:hover {
            background: rgba(70, 150, 255, 0.3);
            border-color: rgba(70, 150, 255, 0.4);
        }

        .btn-group .btn-share:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-group .btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .ad-grid-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            padding: 1.5rem 0.5rem;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ad-grid-item .ad-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ad-grid-item .ad-content {
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            margin-top: 0.3rem;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-content img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
            border-radius: 0.8rem;
        }

        .modal-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            backdrop-filter: blur(8px);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: rotate(90deg);
        }

        .modal-download-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: rgba(70, 150, 255, 0.2);
            border: 1px solid rgba(70, 150, 255, 0.25);
            border-radius: 60px;
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(8px);
            z-index: 1001;
        }

        .modal-download-btn:hover {
            background: rgba(70, 150, 255, 0.35);
            border-color: rgba(70, 150, 255, 0.5);
        }

        .modal-download-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .modal-ad {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 0.6rem;
            padding: 0.3rem 1.2rem;
            z-index: 1001;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .modal-ad .ad-label {
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-ad .ad-content {
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.6rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 40, 60, 0.95);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #eef4ff;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty-state h3 {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 0.3rem;
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
        }

        @media (max-width: 768px) {
            .ad-sidebar-wrapper {
                grid-template-columns: 1fr;
            }
            .ad-grid-2 {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2rem;
            }
            .gallery {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .ad-160x600, .ad-160x300 {
                min-height: 100px;
                max-width: 100%;
            }
            .ad-728x90 { min-height: 60px; }
            .ad-300x250 { min-height: 180px; }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.8rem;
            }
            .gallery {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== ADS SECTION ===== -->
        <div id="adsContainer">
            <!-- Popunder -->
            <div class="ad-container ad-popunder" id="ad-popunder">
                <div class="ad-label">Popunder</div>
                <div class="ad-placeholder" id="adcode-popunder"></div>
            </div>

            <!-- Social Bar -->
            <div class="ad-container ad-socialbar" id="ad-socialbar">
                <div class="ad-label">Social Bar</div>
                <div class="ad-placeholder" id="adcode-socialbar"></div>
            </div>

            <!-- Smartlink -->
            <div class="ad-container ad-smartlink" id="ad-smartlink">
                <div class="ad-label">Smartlink</div>
                <div class="ad-placeholder" id="adcode-smartlink"></div>
            </div>

            <!-- Banner 728x90 -->
            <div class="ad-container ad-728x90" id="ad-banner728">
                <div class="ad-label">Banner 728x90</div>
                <div class="ad-placeholder" id="adcode-banner728"></div>
            </div>

            <a href="index.html" class="back-btn">← Back to Home</a>

            <header class="header">
                <h1>Wallpaper Gallery</h1>
                <p>Click image to preview · Download or Share</p>
                <div class="badge">Free HD Wallpapers</div>
            </header>

            <!-- Native Banner -->
            <div class="ad-container ad-native" id="ad-native">
                <div class="ad-label">Native Banner</div>
                <div class="ad-placeholder" id="adcode-native"></div>
            </div>

            <div class="ad-sidebar-wrapper">
                <div>
                    <div class="gallery" id="gallery"></div>

                    <!-- Banner 468x60 -->
                    <div class="ad-container ad-468x60" id="ad-banner468" style="margin-top: 1rem;">
                        <div class="ad-label">Banner 468x60</div>
                        <div class="ad-placeholder" id="adcode-banner468"></div>
                    </div>

                    <!-- Banner 320x50 -->
                    <div class="ad-container ad-320x50" id="ad-banner320">
                        <div class="ad-label">Banner 320x50</div>
                        <div class="ad-placeholder" id="adcode-banner320"></div>
                    </div>
                </div>

                <div>
                    <!-- Banner 160x600 -->
                    <div class="ad-container ad-160x600" id="ad-banner160x600">
                        <div class="ad-label">Banner 160x600</div>
                        <div class="ad-placeholder" id="adcode-banner160x600"></div>
                    </div>

                    <!-- Banner 160x300 -->
                    <div class="ad-container ad-160x300" id="ad-banner160x300" style="margin-top: 0.8rem;">
                        <div class="ad-label">Banner 160x300</div>
                        <div class="ad-placeholder" id="adcode-banner160x300"></div>
                    </div>

                    <!-- Banner 300x250 -->
                    <div class="ad-container ad-300x250" id="ad-banner300" style="margin-top: 0.8rem;">
                        <div class="ad-label">Banner 300x250</div>
                        <div class="ad-placeholder" id="adcode-banner300"></div>
                    </div>
                </div>
            </div>

            <!-- Banner 468x60 Bottom -->
            <div class="ad-container ad-468x60" id="ad-banner468-bottom" style="margin-top: 1rem;">
                <div class="ad-label">Banner 468x60</div>
                <div class="ad-placeholder" id="adcode-banner468-bottom"></div>
            </div>
        </div>

        <div class="footer-text">
            Data stored in your browser · localStorage
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">×</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview wallpaper">
        </div>
        <a href="#" id="modalDownloadBtn" class="modal-download-btn" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Download
        </a>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // LOAD ADS FROM LOCALSTORAGE
        // ============================================================
        const ADS_STORAGE_KEY = 'ads_codes';

        function loadAds() {
            try {
                const data = localStorage.getItem(ADS_STORAGE_KEY);
                if (data) {
                    return JSON.parse(data);
                }
                return [];
            } catch {
                return [];
            }
        }

        function renderAds() {
            const ads = loadAds();

            // Map ad IDs to container IDs
            const adMap = {
                'popunder': 'adcode-popunder',
                'socialbar': 'adcode-socialbar',
                'smartlink': 'adcode-smartlink',
                'banner728': 'adcode-banner728',
                'native': 'adcode-native',
                'banner468': 'adcode-banner468',
                'banner320': 'adcode-banner320',
                'banner160x600': 'adcode-banner160x600',
                'banner160x300': 'adcode-banner160x300',
                'banner300': 'adcode-banner300'
            };

            ads.forEach(ad => {
                const containerId = adMap[ad.id];
                if (!containerId) return;

                const container = document.getElementById(containerId);
                if (!container) return;

                // Show ad if active and has code
                if (ad.active && ad.code && ad.code.trim() !== '') {
                    // Insert the ad code
                    container.innerHTML = ad.code;
                } else {
                    // Show placeholder
                    const label = ad.name || ad.id;
                    container.innerHTML = `<span style="color: rgba(255,255,255,0.08); font-size: 0.7rem;">[ ${label} - Inactive ]</span>`;
                }
            });

            // Also handle Native Banner in modal
            const nativeAd = ads.find(a => a.id === 'native');
            const modalAd = document.querySelector('.modal-ad .ad-content');
            if (modalAd && nativeAd && nativeAd.active && nativeAd.code) {
                modalAd.innerHTML = nativeAd.code;
            } else if (modalAd) {
                modalAd.textContent = '[ Native Banner ]';
            }
        }

        // ============================================================
        // WALLPAPER DATA
        // ============================================================
        const STORAGE_KEY = 'wallpaper_data';

        function loadWallpapers() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        const wallpapers = loadWallpapers();
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');
        const toast = document.getElementById('toast');

        function renderGallery() {
            if (wallpapers.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <h3>No wallpapers available</h3>
                        <p>Check back later for new wallpapers</p>
                        <p style="margin-top: 0.5rem; font-size: 0.7rem; color: rgba(255,255,255,0.1);">
                            Admin can upload via <a href="adminpanel.html" style="color: #7abfff; text-decoration: none;">Admin Panel</a>
                        </p>
                    </div>
                `;
                return;
            }

            let html = '';
            wallpapers.forEach((wp, index) => {
                html += `
                    <div class="wallpaper-card">
                        <div class="wallpaper-thumb" onclick="openModal('${wp.image}', '${wp.download}', '${wp.title}')">
                            <img src="${wp.image}" alt="${wp.title}" loading="lazy">
                            <div class="preview-overlay">
                                <span>Preview</span>
                            </div>
                        </div>
                        <div class="wallpaper-info">
                            <div class="title">${wp.title}</div>
                            <div class="meta">${wp.category} · HD</div>
                            <div class="btn-group">
                                <a href="${wp.download}" download="${wp.title}.jpg" class="btn btn-download">
                                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                    Download
                                </a>
                                <button class="btn btn-share" onclick="shareWallpaper('${wp.title}', '${wp.image}')">
                                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                                    Share
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // Insert ad after every 4 wallpapers
                if ((index + 1) % 4 === 0 && index < wallpapers.length - 1) {
                    // Try to get native ad from localStorage
                    const ads = loadAds();
                    const nativeAd = ads.find(a => a.id === 'native');
                    const adContent = nativeAd && nativeAd.active && nativeAd.code ? nativeAd.code : '📢 Sponsored';

                    html += `
                        <div class="ad-grid-item">
                            <div class="ad-label">Advertisement</div>
                            <div style="font-size: 1.5rem; opacity: 0.15; margin: 0.3rem 0;">📢</div>
                            <div class="ad-content">${adContent}</div>
                        </div>
                    `;
                }
            });

            gallery.innerHTML = html;
        }

        function openModal(imageUrl, downloadUrl, title) {
            modalImage.src = imageUrl;
            modalDownloadBtn.href = downloadUrl;
            modalDownloadBtn.download = title + '.jpg';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function shareWallpaper(title, imageUrl) {
            const shareData = {
                title: title,
                text: 'Check out this wallpaper: ' + title,
                url: imageUrl
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .then(() => showToast('Shared!'))
                    .catch((err) => {
                        if (err.name !== 'AbortError') {
                            fallbackShare(imageUrl);
                        }
                    });
            } else {
                fallbackShare(imageUrl);
            }
        }

        function fallbackShare(imageUrl) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(imageUrl)
                    .then(() => showToast('URL copied!'))
                    .catch(() => {
                        window.open(imageUrl, '_blank');
                        showToast('Opening in new tab');
                    });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = imageUrl;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('URL copied!');
                } catch (e) {
                    window.open(imageUrl, '_blank');
                    showToast('Opening in new tab');
                }
                document.body.removeChild(textarea);
            }
        }

        let toastTimeout;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // INIT - Render Gallery & Ads
        // ============================================================
        renderGallery();
        renderAds();

        // Re-render ads when page loads (for any dynamic content)
        document.addEventListener('DOMContentLoaded', function() {
            renderAds();
        });

        // ============================================================
        // NOTES FOR ADMIN:
        // ============================================================
        /*
        CARA KERJA:
        1. Admin masukkan kode iklan di Admin Panel (tab "Ad Codes")
        2. Kode disimpan di localStorage dengan key 'ads_codes'
        3. Halaman wallpaper membaca kode dari localStorage
        4. Iklan akan tampil jika status "Active" dan ada kode

        Jika iklan tidak muncul:
        - Pastikan status "Active" (toggle hijau)
        - Pastikan ada kode yang dimasukkan
        - Clear cache browser (Ctrl+Shift+Delete)
        - Buka di mode incognito untuk test
        */
    </script>
</body>
