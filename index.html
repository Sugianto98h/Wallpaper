<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f1a;
            color: #eef4ff;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== ADS OTOMATIS ===== */
        .ad-wrap {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 0.8rem;
            padding: 0.5rem;
            margin: 0.6rem auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .ad-wrap .ad-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .ad-wrap .ad-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            flex-wrap: wrap;
        }

        .ad-wrap .ad-box iframe,
        .ad-wrap .ad-box img,
        .ad-wrap .ad-box script {
            max-width: 100%;
        }

        /* ===== UKURAN OTOMATIS ===== */
        .ad-size-728x90 { min-height: 90px; max-width: 728px; }
        .ad-size-468x60 { min-height: 60px; max-width: 468px; }
        .ad-size-320x50 { min-height: 50px; max-width: 320px; }
        .ad-size-300x250 { min-height: 250px; max-width: 300px; }
        .ad-size-160x600 { min-height: 400px; max-width: 160px; }
        .ad-size-160x300 { min-height: 200px; max-width: 160px; }
        .ad-size-native { min-height: 80px; max-width: 600px; }
        .ad-size-smartlink { min-height: 50px; max-width: 400px; }
        .ad-size-popunder { min-height: 30px; max-width: 300px; }
        .ad-size-socialbar { min-height: 30px; max-width: 500px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin: 0.5rem 0 1rem;
            font-size: 0.85rem;
        }
        .back-btn:hover { color: #fff; }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #7abfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p { color: rgba(255, 255, 255, 0.5); }
        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8ab4ff;
            margin-top: 0.5rem;
        }

        .sidebar-wrap {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 1.5rem;
            align-items: start;
            margin: 1rem 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .wallpaper-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        .wallpaper-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .wallpaper-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #1a1f2e;
            cursor: pointer;
            position: relative;
        }
        .wallpaper-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        .wallpaper-card:hover .wallpaper-thumb img { transform: scale(1.05); }
        .wallpaper-thumb .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }
        .wallpaper-thumb:hover .overlay { opacity: 1; }
        .wallpaper-thumb .overlay span {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .wallpaper-info {
            padding: 0.8rem 1rem 1rem;
        }
        .wallpaper-info .title { font-weight: 600; font-size: 0.95rem; }
        .wallpaper-info .meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 0.6rem;
        }

        .btn-group {
            display: flex;
            gap: 0.4rem;
        }
        .btn-group .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            padding: 0.4rem 0.6rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #eef4ff;
        }
        .btn-group .btn-download {
            background: rgba(70, 150, 255, 0.15);
            border-color: rgba(70, 150, 255, 0.2);
            flex: 2;
        }
        .btn-group .btn-download:hover { background: rgba(70, 150, 255, 0.3); }
        .btn-group .btn-share:hover { background: rgba(255, 255, 255, 0.06); }
        .btn-group .btn svg { width: 12px; height: 12px; fill: currentColor; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255, 255, 255, 0.2);
        }
        .empty-state h3 { color: rgba(255, 255, 255, 0.4); }
        .empty-state a { color: #7abfff; text-decoration: none; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 0.8rem;
        }
        .modal-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            backdrop-filter: blur(8px);
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: rotate(90deg);
        }
        .modal-download-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: rgba(70, 150, 255, 0.2);
            border: 1px solid rgba(70, 150, 255, 0.25);
            border-radius: 60px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(8px);
            z-index: 1001;
        }
        .modal-download-btn:hover { background: rgba(70, 150, 255, 0.35); }
        .modal-download-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 40, 60, 0.95);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #eef4ff;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.5s;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
        }

        @media (max-width: 768px) {
            .sidebar-wrap { grid-template-columns: 1fr; }
            .header h1 { font-size: 2rem; }
            .gallery { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .ad-size-160x600 { min-height: 120px; max-width: 100%; }
            .ad-size-160x300 { min-height: 120px; max-width: 100%; }
        }
        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.6rem; }
            .ad-size-728x90 { min-height: 60px; }
            .ad-size-300x250 { min-height: 180px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== IKLAN ATAS (AUTO) ===== -->
        <div id="adsTop"></div>

        <a href="index.html" class="back-btn">← Back to Home</a>

        <header class="header">
            <h1>Wallpaper Gallery</h1>
            <p>Click image to preview · Download or Share</p>
            <div class="badge">Free HD Wallpapers</div>
        </header>

        <div class="sidebar-wrap">

            <div>
                <div class="gallery" id="gallery"></div>
                <div id="adsBottom"></div>
            </div>

            <div id="adsSidebar"></div>

        </div>

        <div class="footer-text">
            Data stored in your browser · localStorage
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">×</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview" />
        </div>
        <a href="#" id="modalDownloadBtn" class="modal-download-btn" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Download
        </a>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        // DATA IKLAN - OTOMATIS SEMUA UKURAN
        // ================================================================
        const ADS_KEY = 'ads_codes';

        function getAds() {
            try {
                const raw = localStorage.getItem(ADS_KEY);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch {
                return [];
            }
        }

        // ================================================================
        // KONFIGURASI IKLAN OTOMATIS
        // ================================================================
        const adConfig = {
            popunder: { label: 'POPUNDER', size: 'ad-size-popunder', position: 'top' },
            socialbar: { label: 'SOCIAL BAR', size: 'ad-size-socialbar', position: 'top' },
            smartlink: { label: 'SMARTLINK', size: 'ad-size-smartlink', position: 'top' },
            banner728: { label: 'BANNER 728x90', size: 'ad-size-728x90', position: 'top' },
            native: { label: 'NATIVE BANNER', size: 'ad-size-native', position: 'top' },
            banner468: { label: 'BANNER 468x60', size: 'ad-size-468x60', position: 'bottom' },
            banner320: { label: 'BANNER 320x50', size: 'ad-size-320x50', position: 'bottom' },
            banner160x600: { label: 'BANNER 160x600', size: 'ad-size-160x600', position: 'sidebar' },
            banner160x300: { label: 'BANNER 160x300', size: 'ad-size-160x300', position: 'sidebar' },
            banner300: { label: 'BANNER 300x250', size: 'ad-size-300x250', position: 'sidebar' },
        };

        // ================================================================
        // EKSEKUSI KODE IKLAN
        // ================================================================
        function executeAdCode(code, container) {
            if (!code || code.trim() === '') return false;

            try {
                // Cek apakah ada script
                if (code.includes('<script')) {
                    // Ekstrak script
                    const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                    let match;
                    let scripts = [];
                    let htmlContent = code;

                    while ((match = scriptRegex.exec(code)) !== null) {
                        scripts.push(match[1]);
                        htmlContent = htmlContent.replace(match[0], '');
                    }

                    if (htmlContent.trim() !== '') {
                        container.innerHTML = htmlContent;
                    }

                    scripts.forEach(scriptCode => {
                        if (scriptCode.trim() !== '') {
                            try {
                                const scriptEl = document.createElement('script');
                                scriptEl.textContent = scriptCode;
                                document.head.appendChild(scriptEl);
                            } catch (e) { /* ignore */ }
                        }
                    });

                    const srcRegex = /<script[^>]*src=["']([^"']*)["'][^>]*>/gi;
                    let srcMatch;
                    while ((srcMatch = srcRegex.exec(code)) !== null) {
                        const scriptEl = document.createElement('script');
                        scriptEl.src = srcMatch[1];
                        document.head.appendChild(scriptEl);
                    }

                    return true;
                }

                // HTML biasa
                if (code.includes('<iframe') || code.includes('<img') || code.includes('<a') || code.includes('<div')) {
                    container.innerHTML = code;
                    return true;
                }

                // JavaScript murni
                if (code.includes('document.write') || code.includes('innerHTML')) {
                    try {
                        const scriptEl = document.createElement('script');
                        scriptEl.textContent = code;
                        document.head.appendChild(scriptEl);
                        return true;
                    } catch (e) { /* ignore */ }
                }

                // Teks biasa
                container.textContent = code;
                return true;

            } catch (e) {
                console.warn('Error executing ad code:', e);
                return false;
            }
        }

        // ================================================================
        // RENDER IKLAN - OTOMATIS SEMUA
        // ================================================================
        function renderAds() {
            const ads = getAds();

            // Container
            const adsTop = document.getElementById('adsTop');
            const adsBottom = document.getElementById('adsBottom');
            const adsSidebar = document.getElementById('adsSidebar');

            // Kosongkan
            adsTop.innerHTML = '';
            adsBottom.innerHTML = '';
            adsSidebar.innerHTML = '';

            // Filter iklan aktif
            const activeAds = ads.filter(ad => {
                const config = adConfig[ad.id];
                if (!config) return false;
                return ad.active && ad.code && ad.code.trim() !== '';
            });

            console.log(`📢 Total iklan aktif: ${activeAds.length}`);

            if (activeAds.length === 0) {
                // Tidak ada iklan, tampilkan pesan
                adsTop.innerHTML = `
                    <div style="text-align:center;padding:0.5rem;color:rgba(255,255,255,0.03);font-size:0.7rem;">
                        Tidak ada iklan aktif
                    </div>
                `;
                return;
            }

            // Buat setiap iklan
            activeAds.forEach(ad => {
                const config = adConfig[ad.id];
                if (!config) return;

                // Buat container
                const wrap = document.createElement('div');
                wrap.className = `ad-wrap ${config.size}`;

                // Label
                const label = document.createElement('div');
                label.className = 'ad-label';
                label.textContent = config.label;
                wrap.appendChild(label);

                // Box untuk kode
                const box = document.createElement('div');
                box.className = 'ad-box';
                wrap.appendChild(box);

                // Tentukan posisi
                let target;
                if (config.position === 'top') target = adsTop;
                else if (config.position === 'bottom') target = adsBottom;
                else if (config.position === 'sidebar') target = adsSidebar;

                if (target) {
                    target.appendChild(wrap);
                }

                // Eksekusi kode
                const success = executeAdCode(ad.code, box);

                if (!success) {
                    box.innerHTML =
                        `<span style="color:rgba(255,100,100,0.2);font-size:0.6rem;">[ ${ad.id} - error ]</span>`;
                }

                console.log(`✅ ${config.label} dimuat ke ${config.position}`);
            });

            // Jika sidebar kosong, sembunyikan
            if (adsSidebar.children.length === 0) {
                adsSidebar.innerHTML = `
                    <div style="text-align:center;padding:0.5rem;color:rgba(255,255,255,0.02);font-size:0.6rem;">
                        No sidebar ads
                    </div>
                `;
            }
        }

        // ================================================================
        // WALLPAPER
        // ================================================================
        const WP_KEY = 'wallpaper_data';

        function getWallpapers() {
            try {
                const raw = localStorage.getItem(WP_KEY);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch {
                return [];
            }
        }

        const wallpapers = getWallpapers();
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        const modalDownload = document.getElementById('modalDownloadBtn');
        const toast = document.getElementById('toast');

        function renderGallery() {
            if (wallpapers.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <h3>Belum ada wallpaper</h3>
                        <p>Admin bisa upload di <a href="adminpanel.html">Admin Panel</a></p>
                    </div>
                `;
                return;
            }

            let html = '';
            wallpapers.forEach((wp, i) => {
                html += `
                    <div class="wallpaper-card">
                        <div class="wallpaper-thumb" onclick="openModal('${wp.image}','${wp.download}','${wp.title}')">
                            <img src="${wp.image}" alt="${wp.title}" loading="lazy" />
                            <div class="overlay"><span>Preview</span></div>
                        </div>
                        <div class="wallpaper-info">
                            <div class="title">${wp.title}</div>
                            <div class="meta">${wp.category} · HD</div>
                            <div class="btn-group">
                                <a href="${wp.download}" download="${wp.title}.jpg" class="btn btn-download">
                                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                    Download
                                </a>
                                <button class="btn btn-share" onclick="shareIt('${wp.title}','${wp.image}')">
                                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                                    Share
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            gallery.innerHTML = html;
        }

        // ================================================================
        // MODAL
        // ================================================================
        function openModal(imgUrl, dlUrl, title) {
            modalImg.src = imgUrl;
            modalDownload.href = dlUrl;
            modalDownload.download = title + '.jpg';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ================================================================
        // SHARE
        // ================================================================
        function shareIt(title, url) {
            const data = { title, text: 'Check this wallpaper: ' + title, url };
            if (navigator.share) {
                navigator.share(data).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showToast('URL copied!'));
            } else {
                prompt('Copy URL:', url);
            }
        }

        // ================================================================
        // TOAST
        // ================================================================
        let toastTimer;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ================================================================
        // JALANKAN
        // ================================================================
        renderGallery();
        renderAds();

        document.addEventListener('DOMContentLoaded', function() {
            renderAds();
        });

        console.log('✅ Halaman siap!');
        console.log('📢 Sistem iklan otomatis berjalan');
        console.log('🖼️ Jumlah wallpaper:', wallpapers.length);
    </script>

</body>
</html>
