<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f1a;
            color: #eef4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #7abfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 3rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: #eef4ff;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(70, 150, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }

        .card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .card .badge {
            display: inline-block;
            margin-top: 0.8rem;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            background: rgba(70, 150, 255, 0.15);
            border: 1px solid rgba(70, 150, 255, 0.2);
            color: #8ab4ff;
        }

        .footer {
            margin-top: 3rem;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .cards {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wallpaper Gallery</h1>
        <p class="subtitle">Free HD Wallpapers · Download & Share</p>

        <div class="cards">
            <a href="wallpaper.html" class="card">
                <span class="icon">🖼️</span>
                <h3>View Gallery</h3>
                <p>Browse and download wallpapers</p>
                <span class="badge">Public</span>
            </a>

            <a href="adminpanel.html" class="card">
                <span class="icon">⚙️</span>
                <h3>Admin Panel</h3>
                <p>Upload and manage wallpapers</p>
                <span class="badge">Private</span>
            </a>
        </div>

        <div class="footer">
            <p>Data stored in your browser · localStorage</p>
        </div>
    </div>
</body>
</html>
